<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courier Label Splitter (4×6)</title>
    
    <!-- Tailwind CSS for Modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PDF-Lib for Client-Side Manipulation -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .console-log {
            background-color: #0f172a;
            color: #38bdf8;
            font-family: 'JetBrains Mono', monospace;
            padding: 1.25rem;
            border-radius: 0.75rem;
            height: 220px;
            overflow-y: auto;
            font-size: 0.8rem;
            border: 1px solid #1e293b;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }

        .console-log::-webkit-scrollbar {
            width: 8px;
        }

        .console-log::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        .drop-zone {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .drop-zone:hover {
            border-color: #3b82f6;
            background-color: #f0f7ff;
            transform: translateY(-2px);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
            transform: scale(1.01);
        }

        .btn-gradient:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <!-- Main Container -->
    <div class="glass-card w-full max-w-2xl shadow-xl rounded-2xl overflow-hidden">
        
        <!-- Header -->
        <div class="bg-slate-900 text-white p-8 border-b-2 border-blue-500">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-extrabold tracking-tight uppercase">Label Splitter 4.0</h1>
                    <p class="text-slate-400 text-sm mt-2 font-medium">Professional Label Processing Engine</p>
                </div>
                <div class="bg-blue-500/10 p-3 rounded-xl border border-blue-500/20">
                    <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div class="p-8">
            <!-- Upload Section -->
            <div id="upload-section" class="mb-8">
                <div class="drop-zone border-2 border-dashed border-slate-300 rounded-2xl p-12 text-center cursor-pointer relative" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" accept="application/pdf" class="hidden" onchange="updateFileInfo(event)">
                    <div class="text-slate-500">
                        <div class="bg-slate-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        </div>
                        <p class="font-bold text-xl text-slate-700" id="file-status">Upload PDF File</p>
                        <p class="text-sm mt-2 text-slate-400">Target: 4 labels per page layout</p>
                    </div>
                </div>
            </div>

            <!-- Stats Dashboard -->
            <div id="stats" class="grid grid-cols-2 gap-6 mb-8 hidden animate-in fade-in slide-in-from-bottom-4 duration-500">
                <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                    <p class="text-xs text-slate-500 uppercase font-bold tracking-wider">Input Sheets</p>
                    <p id="inputPagesDisplay" class="text-3xl font-extrabold text-slate-800">0</p>
                </div>
                <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100">
                    <p class="text-xs text-blue-500 uppercase font-bold tracking-wider">Output Labels</p>
                    <p id="labelCountDisplay" class="text-3xl font-extrabold text-blue-600">0</p>
                </div>
            </div>

            <!-- Log -->
            <div class="mb-8">
                <div class="flex items-center justify-between mb-3 px-1">
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Process Monitor</p>
                    <div class="flex space-x-1">
                        <div class="w-2 h-2 rounded-full bg-slate-300"></div>
                        <div class="w-2 h-2 rounded-full bg-slate-300"></div>
                        <div class="w-2 h-2 rounded-full bg-slate-300"></div>
                    </div>
                </div>
                <div id="console" class="console-log">
                    <div class="opacity-50"># Terminal initialized... ready for command.</div>
                </div>
            </div>

            <!-- Action -->
            <button id="processBtn" onclick="processPDF()" class="btn-gradient w-full text-white font-bold py-5 px-8 rounded-2xl shadow-lg uppercase tracking-widest flex items-center justify-center space-x-3">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                <span>Process & Split Labels</span>
            </button>
            
            <p class="text-center text-slate-400 text-[10px] mt-6 uppercase tracking-widest">Calculated to exact 4x6 thermal printer specifications</p>
        </div>
    </div>

    <script>
        const CM_TO_PT = 28.3465;
        const IN_TO_PT = 72;

        // EXACT CROP PRESETS (cm)
        const LABELS = [
            { top: 0.18, bottom: 20.32, left: 2.91, right: 10.40 }, // Label 1
            { top: 0.18, bottom: 20.32, left: 10.32, right: 2.99 }, // Label 2
            { top: 9.34, bottom: 11.17, left: 2.99, right: 10.32 }, // Label 3
            { top: 9.34, bottom: 11.17, left: 10.40, right: 2.91 }  // Label 4
        ];

        function log(msg, color = "#38bdf8") {
            const consoleEl = document.getElementById('console');
            const div = document.createElement('div');
            div.style.color = color;
            const timestamp = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            div.textContent = `[${timestamp}] ${msg}`;
            consoleEl.appendChild(div);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function updateFileInfo(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('file-status').innerText = file.name;
                log(`IO: File stream opened - ${file.name}`);
            }
        }

        async function processPDF() {
            const fileInput = document.getElementById("fileInput");
            if (!fileInput.files.length) {
                log("FAIL: Missing input stream", "#f87171");
                return;
            }

            const processBtn = document.getElementById('processBtn');
            processBtn.disabled = true;
            processBtn.classList.add('opacity-50', 'cursor-not-allowed');

            log("START: Initializing PDF processing core...");
            const file = fileInput.files[0];
            const arrayBuffer = await file.arrayBuffer();

            const srcPdf = await PDFLib.PDFDocument.load(arrayBuffer);
            const outPdf = await PDFLib.PDFDocument.create();
            const pages = srcPdf.getPages();
            
            document.getElementById('stats').classList.remove('hidden');
            document.getElementById('inputPagesDisplay').innerText = pages.length;
            document.getElementById('labelCountDisplay').innerText = pages.length * 4;

            let totalLabelsProcessed = 0;

            for (let i = 0; i < pages.length; i++) {
                const page = pages[i];
                const { width, height } = page.getSize();
                log(`PROC: Slicing Sheet ${i + 1} of ${pages.length}...`);

                for (let j = 0; j < LABELS.length; j++) {
                    const l = LABELS[j];
                    
                    const cropBox = {
                        left: l.left * CM_TO_PT,
                        bottom: l.bottom * CM_TO_PT,
                        right: width - (l.right * CM_TO_PT),
                        top: height - (l.top * CM_TO_PT)
                    };

                    const [embedded] = await outPdf.embedPages([page], [cropBox]);

                    // Create EXACT 4x6 inch page
                    const newPage = outPdf.addPage([4 * IN_TO_PT, 6 * IN_TO_PT]);

                    const pageW = newPage.getWidth();
                    const pageH = newPage.getHeight();

                    const labelW = embedded.width;
                    const labelH = embedded.height;

                    const scale = Math.min(
                        pageW / labelW,
                        pageH / labelH
                    );

                    const drawW = labelW * scale;
                    const drawH = labelH * scale;

                    const x = (pageW - drawW) / 2;
                    const y = (pageH - drawH) / 2;

                    newPage.drawPage(embedded, {
                        x: x,
                        y: y,
                        width: drawW,
                        height: drawH
                    });

                    totalLabelsProcessed++;
                }
            }

            log(`VERIFY: Integrity check ${totalLabelsProcessed}/${pages.length * 4}`);
            if (totalLabelsProcessed !== pages.length * 4) {
                log("CRITICAL: PARSING MISMATCH DETECTED", "#f87171");
                processBtn.disabled = false;
                processBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                return;
            }

            const pdfBytes = await outPdf.save();
            const blob = new Blob([pdfBytes], { type: "application/pdf" });
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = `split_labels_${new Date().getTime()}.pdf`;
            a.click();

            log("SUCCESS: PDF compiled and exported.", "#4ade80");
            processBtn.disabled = false;
            processBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
    </script>
</body>
</html>
